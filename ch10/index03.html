<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style></style>
  </head>
  <body>
    <h1>ch10 index03.html 파일</h1>
    <button id="assign-btn">이동1</button>
    <p id="info">정보 표시</p>

    <script>
      console.log("1. URL의 가 부분 읽기");
      console.log(window.location.href); // 전체 주소 정보
      console.log(window.location.protocol); //전체 주소 정보
      console.log(window.location.host); //도메인과 포트(통신규약)
      console.log(window.location.pathname); //도메인 뒤에 경로
      console.log(window.location.search); //? 뒤에 쿼리 문자열

      /////////////////////////////////////////
      const params = new URLSearchParams(location.search);
      const page = params.get("page");
      const keyword = params.get("keyword");
      console.log(page);
      console.log(keyword);

      //http://localhost:5500/ch10/index03.html?page=10&keyword=js

      document.getElementById("assign-btn").addEventListener("click", function () {
        window.location.assign("index04.html");
      });

      document.getElementById("assign-btn").addEventListener("click", function () {
        window.location.reload(); //새로 고침
      });

      document.getElementById("assign-btn").addEventListener("click", function () {
        window.location.replace("index04.html"); //페이지 이동(방문 기록에 남기지 않습니다.)
        // 로그인 시도 시 다시 볼 페이지를 뒤로 가기 페이지를 눌렀을 때 나오지 않게 하기 위한 용도로 많이 사용됨
      });
    </script>
  </body>
</html>
