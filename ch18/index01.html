<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch18 index01.html 파일</h1>

    <script>
      // 데이터를 주고 받는 방식을 살펴보자.
      const todo = { userId: 1, id: 100, title: "오늘 복습", completed: false };

      // 객체 --> JSON 문자열(서버로 보낼 때)
      // 어떤 서버에서든 이해 가능한 문자열이 된다.
      const jsonText = JSON.stringify(todo);
      console.log(jsonText);
      console.log(typeof jsonText);

      //JSON 문자열 --> 객체(서버에서 받았을 때)
      // replace로 일일이 잘라내야하는 번거로움을 줄일 수 있다.
      const parsedTodo = JSON.parse(jsonText);
      console.log(parsedTodo);
      console.log(typeof parsedTodo);
      console.log(parsedTodo.id);
      console.log(parsedTodo.title);

      //오류 확인
      try {
        const badTodo = JSON.parse("sdkljghklsjfghgklj : alfkjlksdfzgh ");
      } catch (error) {
        console.log("잘못된 JSON 형식입니다.");
      }
    </script>
  </body>
</html>

// 객체 --> 자바스크립트 타입에서 ---> JSON 문자열 JSON.springify(); // 서버측으로 데이터를 보낼 때 () // 응답
--> 문자열 --> 객체 : JSON.parse(json 문자열); // 서버측에서 데이터를 받았을 때
