<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../reset.css" />
    <style>
      /* <!-- 1단계: 리셋 + 전역 스타일 --> */
      body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333;
        padding: 20px;
      }

      /* 2단계: 레이아웃 (큰 틀 배치) */
      .banner-container {
        display: flex;
        align-items: center;
        width: 80%;
        max-width: 600px;
        margin: 50px auto;
      }

      .image-wrapper {
        flex: 1;
        height: 200px;
        /* height 영역 밖으로 나온 부분은 잘라서 보이지 않게 한다. */
        overflow: hidden;
      }

      .image-track {
        /* 자식 이미지들을 가로로 쫙 나열한다. */
        display: flex;
        width: 100%;
        height: 100%;
      }

      .image-track img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* 찌그러짐 방지 */
        /* 중요!: flex 컨테이너 안에서 이미지의 크기가 줄어들지 않도록 100% 강제 유지 */
        flex-shrink: 0;
      }

      /* 3단계: 컴포넌트 스타일 */

      .banner-container {
        border: 2px solid black;
      }

      .control-btn {
        padding: 20px;
        background: none;
        border: none;
        font-size: 20px;
      }

      /* 4단계: 세부조정 */

      .control-btn {
        cursor: pointer;
        transition: transform 0.2s ease;
      }

      .control-btn:hover {
        transform: scale(1.3);
      }

      /* 5단계: 반응형 처리 */
    </style>
  </head>
  <body>
    <h1>ch16 index04.html 파일 - 배너 변경</h1>

    <div class="banner-container">
      <button class="control-btn prev-btn">&lt;</button>

      <div class="image-wrapper">
        <div class="image-track">
          <img src="https://picsum.photos/id/20/400/300" alt="" />
          <img src="https://picsum.photos/id/30/400/300" alt="" />
          <img src="https://picsum.photos/id/40/400/300" alt="" />
        </div>
      </div>

      <button class="control-btn next-btn">&gt;</button>

      <script>
        const prevButton = document.querySelector(".prev-btn");
        const nextButton = document.querySelector(".next-btn");
        const imageTrack = document.querySelector(".image-track");
        let imageList = document.querySelectorAll(".image-track img");
        const bannercontainer = document.querySelector(".banner-container");

        //  1. 무한 루프를 위한 이미지 복제 (눈속임용 가짜 이미지 생성)
        const firstImgClone = imageList[0].cloneNode(true);
        const lastImgClone = imageList[imageList.length - 1].cloneNode(true);

        // 맨 뒤에 첫번째 이미지 복사본을 붙이고, 맨 앞에 마지막 이미지 복사본을 붙임
        imageTrack.appendChild(firstImgClone);
        imageTrack.insertBefore(lastImgClone, imageList[0]);

        // 복제본이 추가되었으므로 이미지 목록과 갯수를 다시 업데이트 하기
        imageList = document.querySelectorAll(".image-track img");
        const imageCount = imageList.length; //원래 3개 -> 복제본 포함 5개로 변경

        // 2. 상태 변수 설정
        let currentIndex = 1;
        let timerId = null;
        let isTransitioning = false; // 버튼 광클 방지용(애니메이션 도중 클릭 무시)

        // 초기 위치 셋팅(처음엔 애니메이션 없이 진짜 1번 이미지 위치로 이동)
        imageTrack.style.transform = `translateX(-${currentIndex * 100}%)`;

        //3. 화면 갱신 함수
        function updateBanner(newIndex) {
          //아직 이동중일 경우 함수를 종료(광클 방지)
          if (isTransitioning) return;
          isTransitioning = true;

          currentIndex = newIndex;

          //이동할 때는 애니메이션을 켠다.
          imageTrack.style.transition = "transform 0.5s ease-in-out";
          imageTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
        }

        //4. 애니메이션이 끝났을 때의 처리(가장 중요한 부분!)
        imageTrack.addEventListener("transitionend", () => {
          isTransitioning = false; //이동이 끝났으므로 다시 버튼 클릭 허용

          // 맨 뒤의 '가짜 첫번째 이미지'에 도달했다면?
          if (currentIndex === imageCount - 1) {
            //눈속임: 애니메이션을 끄고 '진짜 첫번째 이미지(index 1)' 위치로 순간이동!
            imageTrack.style.transition = "none";
            currentIndex = 1;
            imageTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
          }

          //맨 앞의 '가짜 마지막 이미지'에 도달했다면?(이전 버튼을 계속 눌렀을 때)
          if (currentIndex === 0) {
            // 눈속임: 애니메이션을 끄고 '진짜 마지막 이미지' 위치로 순간이동!
            imageTrack.style.transition = "none";
            currentIndex = imageCount - 2;
            imageTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
          }
        });

        // 5. 버큰 리스너 등록 (이제 % 연산자 대신 단순히 1을 더하고 뺀다.)
        prevButton.addEventListener("click", () => {
          updateBanner(currentIndex - 1);
        });

        nextButton.addEventListener("click", () => {
          updateBanner(currentIndex + 1);
        });

        //6. 자동 슬라이드 로직
        function startAutoSlide() {
          if (timerId !== null) return;
          timerId = setInterval(() => {
            updateBanner(currentIndex + 1);
          }, 2000);
        }

        function stopAutoSlide() {
          clearInterval(timerId);
          timerId = null;
        }

        bannercontainer.addEventListener("mouseenter", stopAutoSlide);
        bannercontainer.addEventListener("mouseleave", startAutoSlide);

        startAutoSlide();
      </script>
    </div>
  </body>
</html>
