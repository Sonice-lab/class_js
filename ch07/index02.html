<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch07 index02.html 파일</h1>

    <script>
      // 1. boolean이 아닌 값도 조건식에 들어갈 수 있다.
      // Truth
      if (456) {
        console.log("456은 참으로 평가된다.");
      }

      //Falsy
      if (undefined) {
        console.log("456은 참으로 평가된다.");
      } else {
        console.log("undefined는 거짓으로 평가된다.");
      }

      console.log("-------Falsy 7가지-------");
      //2. falsy한 값은 딱 7가지!
      // 이것만 기억해두면 나머지는 전부 Truthy

      //값을 넣지 않은 상태
      let falsy1 = undefined;
      // 일부러 비워 둔 상태
      let falsy2 = null;
      // 숫자 0
      let falsy3 = 0;
      // 숫자가 아님
      let falsy4 = NaN;
      // 음수 0
      let falsy5 = -0;
      // 빈 문자열도 거짓으로 판별함
      let falsy6 = "";
      // BigInt 타입의 0
      let falsy7 = 0n;

      // 코드 스타일
      if (!falsy1) console.log("undefined는 falsy");
      if (!falsy2) console.log("null는 falsy");
      if (!falsy3) console.log("0는 falsy");
      if (!falsy4) console.log("NaN는 falsy");
      if (!falsy5) console.log("-0는 falsy");
      if (!falsy6) console.log("빈문자열은 falsy");
      if (!falsy7) console.log("0n는 falsy");

      console.log("-------Truthy 예시-------");
      if ("hello") console.log("문자열은 truthy");
      if (100) console.log("양수는 truthy");
      if (-5) console.log("음수는 truthy");
      if ("0") console.log("문자열 0은 truthy");
      if ([]) console.log("빈 배열은 truthy");
      if ({}) console.log("비어있는 객체 리터럴은 truthy");

      // 배열이 비었는지 확인하려면 배열 자체가 아닌 길이로 봐야한다.
      const cart = [];
      if (cart.length === 0) {
        console.log("장바구니가 비어있다.");
      }

      console.log("-------활용: 조건문을 짧게-------");
      function showWriter1(post) {
        if (post === undefined || post === null) {
          console.log("게시글 정보가 없습니다.");
          //단락평가란? 예시) 자바의 빠른 평가
          return;
        }
        console.log(post.writer);
      }
      showWriter1({ writer: "김민수" }); // 김민수
      showWriter1(undefined); // 게시글 정보가 없습니다.

      console.log("-------주의: 0과 빈문자열을 조심해야 한다.-------");

      function showStock(stock) {
        if (!stock) {
          console.log("재고 정보 없음");
          return;
        } else {
          console.log(`재고: ${stock}`);
        }
      }

      showStock(5);
      showStock(0); //falsy로 판단 > 재고 0을 기대했지만 재고 없음으로 출력됨

      function showStockSafe(stock) {
        if (stock === undefined || stock === null) {
          console.log("재고 정보 없음");
          return;
        } else {
          console.log(`재고: ${stock}`);
        }
      }

      showStockSafe(0); // 재고: 0으로 제대로 출력
    </script>
  </body>
</html>
