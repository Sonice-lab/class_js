<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch07 index04.html 파일</h1>
    <script>
      let stock = 0;
      console.log(stock || "재고없음"); // 재고없음, stock이 0으로 초기화했기 때문

      //2. ?? (null 병합 연산자) null과 undefined일 때만 오른쪽 값을 사용
      console.log(stock ?? "재고없음");
      // 0 출력 > 0은 null도 아니고, undefined도 아니므로
      //그대로 0이 된다. > 진짜 재고가 없을 때만 0출력

      let discount = null;
      console.log(discount ?? 0); //기본값 0이 출력된다.

      // 3.
      let comment = "";
      console.log(comment || "댓글없음"); // 댓글없음
      console.log(comment ?? "댓글없음"); // 공백처리

      let isAgree = false;
      console.log(isAgree || true); // true
      console.log(isAgree ?? true); // false

      // 진짜 없을 때 > 오른쪽 기본값으로 설정한다.
    </script>
  </body>
</html>
