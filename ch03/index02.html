<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch03 index02.html</h1>

    <script>
      console.log("1. 블록 밖으로 새어나온다.");

      if (true) {
        var oldStyle = "var로 만든 변수";
        let newStyle = "let으로 만든 변수";
        console.log(newStyle);
      }

      console.log(oldStyle); //var로 만든 변수 > 오류 없이 정상적으로 출력
      //if문 블록 밖인데 정상적으로 출력 가능
      //console.log(newStyle); //오류 발생 > if문 안 쪽에 있어야 정상 출력
      // Uncaught ReferenceError: newStyle is not defined
      //let으로 만든 변수는 같은 상황일 때 오류를 뱉어낸다.

      console.log("2. for 문에서 특히 위험하다.");
      for (var i = 0; i < 3; i++) {}
      //반복문 종료 후 i값 확인
      console.log(i);

      for (let j = 0; j < 3; j++) {
        console.log(j);
      }
      //반목문 종료 후 j값 확인(let으로 변수 선언)
      //console.log(j); //> for문 밖일 경우 오류 발생!
      // Uncaught ReferenceError: j is not defined at index02.html:32:19
      // 에러를 확인할 수 있는 것이 좀 더 안정적인 시스템 구축에 도움이 된다.

      console.log("3. 같은 이름으로 변수를 다시 선언해도 에러가 발생하지 않는다.");
      var username = "홍길동";
      var username = "이순신";
      // 위와 같이 실수로 다시 선언했는데 에러 없이 덮어쓴다.
      console.log(username); //이순신
    </script>
  </body>
</html>
