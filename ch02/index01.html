<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 - index01.html 파일</h1>
    <script>
      // 1. let: 변경이 가능한 값을 담는 상자
      let username = "홍길동"; // username에 홍길동이라는 문자열 값을 담는다.
      console.log(username);

      username = "티모"; // 상자 안에 값을 바꿀 수 있다.
      console.log(username);

      // 2. const는 변수를 만들 때 사용한다.
      // 한번 정하면 바뀌지 않는 값을 담는 상자(상수의 개념)
      const PI = 3.14;
      console.log(PI);

      //3. const 상자는 한 번 값을 넣으면 다시 넣을 수 없다.
      //오류 발생:index01.html:24 Uncaught TypeError: Assignment to constant variable.
      //PI = 3.1415;

      // 4. 한 페이지 안에서 같은 변수를 선언한다면? > 오류 발생
      //let username = "다른사람";

      // 5. 자바스트립트는 타입에 유연한 언어!
      // 변할 수 있는 같은 상자에 다른 종류의 값을 넣을 수 있다.
      let anything = 100;
      anything = "이제는 문자열";
      console.log(anything);
    </script>
  </body>
</html>
