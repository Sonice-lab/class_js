<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch02 index04.html 파일</h1>
    <script>
      console.log("------1. 자동 형변환------");
      // 오직 더하기 연산일 때만 문자로 이어 붙임이 발생됨
      // 자바 스크립트에서는 더하기 연산 제외하고 나머지 연산은 산술 연산으로 자동 형변환이 됨

      console.log(100 + 2); //102
      console.log(100 + "2"); //1002(숫자가 문자로 변해서 이어 붙임)
      console.log(100 * "2"); //200 (곱셈은 문자가 숫자로 변함 > 계산에 반영) > 자동 형변환
      console.log(100 - "2"); //98 (뺄셈도 문자가 숫자로 변함 > 계산에 반영) > 자동 형변환
      console.log(100 / "2"); //50 (나누기 연산도 문자가 숫자로 변함 > 계산에 반영) > 자동 형변환
      console.log(100 % "2"); //0 (나머지 연산도 문자가 숫자로 변함 > 계산에 반영) > 자동 형변환
      console.log(100 * "abc"); //NaN (not a number > 숫자로 바꿀 수 없는 문자열로 변환)
      console.log(100 + "abc"); //100abc 덧셈 연산은 이어 붙임 발생됨

      console.log("------2. 수동 형변환(문자 > 숫자)------");
      let priceText = "123";
      let price = Number(priceText); // 형변환
      console.log(typeof priceText); //String
      console.log(typeof price); //Number
      console.log(price + 100); //223

      //숫자로 바꿀 수 없는 문자를 바꾸면 NaN(Not a Number) 발생
      console.log(Number("abc")); //NaN
      //주의할 점 = 만약 빈 문자열을 숫자로 형변환할 경우 어떻게 될까?
      // 이 부분을 활용할 경우는 어떤 경우가 있을까???
      console.log(Number("")); //0 > 즉, 빈문자열은 0이 된다.

      console.log("------3. 수동 형변환(숫자 > 문자)------");
      let count = 456;
      let countText = String(count);
      console.log(typeof countText); //String
      console.log(countText + "개 입니다."); //456개 입니다.

      console.log("------4. 입력 값은 항상 문자열이다.");
      let input1 = "10";
      let input2 = "20";

      console.log(input1 + input2); // 1020
      console.log(Number(input1) + Number(input2)); //30
    </script>
  </body>
</html>
