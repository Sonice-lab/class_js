<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        border: 1px solid #ccc;
        padding: 10px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>ch08 index02.html</h1>
    <div id="product-list"></div>
    <script>
      console.log("-----1. 숫자 배열 변환 -----");
      const numbers = [1, 2, 3, 4, 5];
      //변환해서 새로운 것을 만들어내야 할 때  > MAP
      const doubled = numbers.map((n) => n * 2);
      console.log(numbers);
      console.log(doubled);

      //도전과제 numbers를 활용해서 doubled와 같은 결과를 낼 수 있는 코드 작성
      // 단, map 사용 금지
      console.log("-----2. 도전과제 -----");
      // 방법 1.
      const double2 = [];
      for (let i = 0; i < numbers.length; i++) {
        double2.push(numbers[i] * 2);
      }
      console.log(double2);

      //방법 2. forEach
      console.log("방법 2. forEach");
      const double3 = [];
      numbers.forEach((d) => {
        double3.push(d * 2);
      });

      console.log(double3);

      console.log("-----2. 객체 배열에서 이름만 뽑기 -----");
      const products = [
        { id: 1, name: "무선마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터받침대", price: 15000, stock: 12 },
      ];

      const names = products.map((p) => p.name);
      console.log(names);

      console.log("-----3. 실무! 객체 배열을 HTML 문자열 배열로 -----");
      const cardList = products.map((p) => {
        return `
        <div class = "card">
          <h3>${p.name}</h3>
          <p> 가격: ${p.price.toLocaleString()}원</p> 
          <p> 재고: ${p.stock}개</p>
        </div>
        `;
      });

      console.log(cardList);
      // 어떻게 활용?
      document.getElementById("product-list").innerHTML = cardList.join("");
    </script>
  </body>
</html>
