<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch05 index01.html 파일</h1>
    <script>
      // 1. 함수 선언문(매개변수 = parameter)
      // 자주 사용하는 코드의 묶음을 자주 호출하기 위함
      function addNumber(a, b) {
        const sum = a + b;
        return sum; //return은 나를 호출한 사람에게 결과를 밖으로 돌려주고 함수를 끝낸다.
      }

      // 2. 함수 호출(인수 = argument)
      const result = addNumber(10, 20);
      console.log(result);

      // 3. 생성자 함수랑 어떤 차이가 있는가?
      // 멤버변수 용도
      function Person(firstName, lastName) {
        this.firstName = firstName;
        this.lastName = lastName;
      }

      // 데이터 타입 typeof
      console.log(typeof addNumber); //function
      console.log(typeof Person); //function

      // 즉, 함수 선언문, 생성자 함수는 같은 타입으로 취급한다.
      // 단, 차이점은 호출하는 방법일 뿐이다.

      const sum = addNumber(20, 20); //그냥 호출 --> return 값이 돌아온다.
      const person1 = new Person("길동", "홍"); //new를 붙여 호출 --> 새 객체가 생성된다.

      console.log(sum); //40
      console.log(person1);

      //생성자 함수와 함수 선언문의 차이점 설명해보기
      // 함수 선언문: 함수 선언 시 매개변수를 설정하고, 호출 시 인수로 부름
      // 생성자 함수: 매개변수를 멤버 변수의 용도로 활용
      //함수 선언문과 생성자 함수는 같은 타입(function)으로 취급되지만
      //호출하여 사용하는 방법에 큰 차이가 있다.
      // 생성자 함수 또한 함수 선언문의 한 종류이다.
      // 5. 실험 1. 함수 선언문에 return 키워드가 없는데 값을 대입 연산자를 사용하면 어떻게 될까?
      function sayHello(name) {
        console.log(name + "입니다.");
      }
      const returned = sayHello("홍길동");
      console.log(returned); //undefined가 출력됨

      // 6. 실험 2. return 키워드가 2개라면
      function checkAge(age) {
        if (age < 0) {
          return "잘못된 나이";
        } else {
          return age + "세";
        }
        console.log("여기 결과가 찍힐까 말까?"); //undefined
      }
      console.log(checkAge(-5));
      console.log(checkAge(25));
      // 7. 매개변수에 기본값을 설정할 수 있다.
      function greet(name = "손님") {
        console.log(name + "님 환영합니다.");
      }

      greet();
      greet("이순신"); //값이 있다면 기본값이 동작하지 않는다.
    </script>
  </body>
</html>
