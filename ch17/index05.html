<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 index05.html 파일 - 배웠던 부분 실습</h1>
    <input type="text" value="팥빙수" style="padding: 4px" id="orderInput" />
    <button id="orderButton">주문 시작</button>
    <p id="noticeBoard" style="padding: 50px; border: 1px solid #ccc; text-align: center">
      주문을 기다리고 있습니다.
    </p>

    <script>
      const orderButton = document.getElementById("orderButton");
      const orderInput = document.getElementById("orderInput");
      const noticeBoard = document.getElementById("noticeBoard");

      // 함수 선언문 - 주문을 받아서 Promise 를 돌려준다.
      function orderCoffee(order) {
        // 코드 작성 ...
        return new Promise(function (resolve, rejected) {
          // 이 안에는 시간이 걸리는 작업을 적는다. 여기서는 3초 타이머로 흉내만 냄
          setTimeout(function () {
            // 3초뒤 응답이 오면 해야할 일을 설계 한다.
            if (order === "아메리카노" || order === "라떼") {
              resolve("주문하신 " + order + "가(이) 나왔습니다"); // 성공 : 이행 상태로 바꾸고 값을 전달
            } else {
              rejected("죄송합니다. " + order + "은(는) 판매하지 않습니다"); // 실패 : 거부 상태로 바꾸고 이유 전달
            }
          }, 3000);
        });
      }

      // 규칙 1. await를 사용하려면 그 코드를 감싸는 함수에는
      // 반드시 async를 붙여야 한다.
      // orderButton.addEventListener("click", async function () {

      //   await orderCoffee(orderInput.value);

      // });

      orderButton.addEventListener("click", async () => {
        try {
          // 1. 대기 상태 UI 업데이트
          // 버튼 비활성화 (중복 클릭 방지)
          orderButton.disabled = true;
          noticeBoard.textContent = "주문을 처리하고 있습니다. 잠시만 기다려주세요...";

          // 2. 비동기 작업 실행
          const message = await orderCoffee(orderInput.value);

          // 3. 성공 시 UI 업데이트
          noticeBoard.textContent = message;
        } catch (error) {
          //실패 시 UI 업데이트
          noticeBoard.textContent = error;
        } finally {
          // 4. 성공하든 실패하든 마지막에 다시 버튼 활성화
          orderButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
