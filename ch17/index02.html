<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 index02.html 파일</h1>
    <p>Promise 객체 생성 즉시 대기 상태가 됨. 작업이 끝나면 이행 또는 거부로 변경됨.</p>
    <button id="startBtn">주문</button>
    <script>
      //함수 선언문 작성
      //목적: 주문을 받아서 Promise를 돌려준다.
      function orderCoffee(order) {
        //코드 작성...
        return new Promise(function (resolve, rejected) {
          // 이 안에는 시간이 걸리는 작업을 적는다.
          // 여기서는 3초 타이머로 흉내만 냄
          setTimeout(function () {
            // 3초뒤 응답이 오면 해야할 일을 설계한다.
            if (order === "아메리카노" || order === "라떼") {
              resolve("주문하신" + order + "가 준비되었습니다."); //성공!: 이행 상태로 바꾸고 값을 전달한다.
            } else {
              reject("[품절]죄송합니다." + order + "의 재료가 모두 소진되어 준비할 수 없습니다."); // 실패: 거부 상태로 변경 후 사유 전달
            }
          }, 3000);
        });
      }

      document.getElementById("startBtn").addEventListener("click", function () {
        const orderPromise = orderCoffee("소주");

        console.log("콘솔에서 상태 확인: ", orderPromise);
        // 클릭 직후: pending 상태가 된다.
        // 3초 뒤 rejected로 응답을 받았다.
      });
    </script>
  </body>
</html>
