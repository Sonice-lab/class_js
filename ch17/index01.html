<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch17 index01.html 파일</h1>

    <script>
      //작업이 순차적으로 이루어져야할 때 함수의 중첩이 발생할 수 있다.
      // 코드가 점점 안으로 파고드는 피라미드 형태가 된다.
      // 단점: 어디에서 오류가 났는지 찾기 힘들다.
      // 콜백 지옥!

      setTimeout(function () {
        console.log("A 작업 완료");

        setTimeout(function () {
          console.log("B 작업 완료");

          setTimeout(function () {
            console.log("C 작업 완료");
          }, 2000);
        }, 2000);
      }, 2000);

      // 테스트 > 제일 먼저 실행됨
      console.log("------ 여기 코드는 언제 실행이 될까요? ----- ");

      // 순차적인 비동기 작업을 처리하기 위해서
      // 과거에는 이러하게 콜백을 중첩해서 사용함
      // 다만, 단계가 늘수록 읽기가 어렵고 에러 처리가 어려워지는 것을
      // 콜백 지옥이라고 부른다.
      // 이 문제를 해결하고 비동기 코드를 평평하게 사용하기 위해
      //Promise가 도입되었다!
    </script>
  </body>
</html>
