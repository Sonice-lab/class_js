<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch 09 index03.html 파일</h1>
    <ul id="fruit-list">
      <li class="fruit">사과</li>
      <li class="fruit">바나나</li>
    </ul>
    <script>
      //1. 같은 요소들을 두가지 방법으로 찾아보자.
      const liveList = document.getElementsByClassName("fruit"); //HTMLcollection
      const staticList = document.querySelectorAll(".fruit"); //NodeList

      console.log(liveList.length);
      console.log(staticList.length);

      // 2. 자바스크립트로 새 요소를 하나 추가하자.
      // CRUD 기능이 포함되어있음
      const newFruit = document.createElement("li");
      console.log(newFruit);
      newFruit.className = "fruit";
      newFruit.textContent = "포도";
      document.getElementById("fruit-list").append(newFruit);

      // 3. 추가한 뒤 두 결과의 갯수를 다시 확인하자.
      console.log(liveList.length); // 3: 생방송: 추가되는 것이 바로 반영됨
      console.log(staticList.length); // 2: 사진: 찍은 시점 그대로 출력

      // 4. 물론, 동적으로 요소를 추가한 뒤 다시 길이를 확인하면 반영됨
      console.log(document.querySelectorAll(".fruit").length);
    </script>
  </body>
</html>
