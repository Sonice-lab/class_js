<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch04 index04.html 파일</h1>

    <script>
      console.log("1. 배열 만들기와 인덱스");
      const fruits = ["사과", "바나나", "포도"];

      console.log(fruits);
      console.log(fruits[0]);
      console.log(fruits[2]);
      console.log(fruits[3]); // n-1 //없는 인덱스 번호 - undefined
      console.log(fruits.length);

      // 항상 마지막 인덱스 값을 출력할 때.
      console.log(fruits[fruits.length - 1]);

      // JS 배열의 값 추가와 제거
      fruits.push("딸기"); //요소의 맨 뒤에 추가
      console.log(fruits);

      fruits.pop(); //요소의 맨 뒤에서 하나 제거
      console.log(fruits);

      fruits[1] = "블루베리";
      console.log(fruits);

      //반복문으로 활용하기

      //방법1. 인덱스를 활용할 때 사용하는 for 구문

      for (let i = 0; i < fruits.length; i++) {
        console.log(i + "번째 과일 " + fruits[i]);
      }

      // 방법2. for ...of 값만 필요할 때 사용
      for (const f of fruits) {
        console.log(f);
      }

      // 객체와 배열: 서버 데이터의 기본 형태

      const studentList = [
        { name: "홍길동", age: 20, major: "컴퓨터공학" },
        { name: "이순신", age: 21, major: "경영" },
      ];

      //반복문을 돌면서 해당 객체의 이름과 나이를 출력하시오.(전체)
      // 방법 1. 인덱스를 활용할 때 사용하는 for 구문
      for (const s of studentList) {
        //만약 나이가 21살 이상만 출력
        if (s.age >= 21) {
          console.log(s.name);
          console.log(s.age);
        }
      }
    </script>
  </body>
</html>
