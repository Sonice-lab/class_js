<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const user = {
        name: "김민수",
        greet: function () {
          console.log(this.name);
        },
      };
      const fn = user.greet;
      fn();

      // 3번 문제
      const counter = {
        count: 0,
        start: function () {
          setTimeout(() => {
            this.count = this.count + 1;
            console.log(this.count);
          }, 1000);
        },
      };
      counter.start();

      // 1번
      const a = {
        name: "A",
        show() {
          console.log(this.name);
        },
      };

      a.show();

      // 2번
      const b = {
        name: "B",
        show: function () {
          console.log(this.name);
        },
      };

      b.show();

      // 3번
      const c = {
        name: "C",
        show() {
          console.log(this.name);
        },
      };

      c.show();

      // 4번
      const d = {
        name: "D",
        items: [1, 2],
        show() {
          this.items.forEach((i) => {
            console.log(this.name);
          });
        },
      };
      d.show();
    </script>
  </body>
</html>
